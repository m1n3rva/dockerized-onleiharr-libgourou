name: Publish Docker Image to GHCR

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Dockerfile'
      - 'tests/**'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Dockerfile'
      - 'tests/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image (without push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: smoke-test:latest

      - name: Run smoke tests
        run: |
          chmod +x tests/smoke.sh
          docker run --rm --entrypoint bash -v "${GITHUB_WORKSPACE}/tests:/tests" smoke-test:latest /tests/smoke.sh

  build-and-push:
    runs-on: ubuntu-latest
    needs: smoke-test
    if: github.event_name == 'push'
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          
          # Read current versions from Dockerfile
          ONLEIHARR_VERSION=$(grep '^ARG ONLEIHARR_VERSION=' Dockerfile | head -1 | sed 's/^ARG ONLEIHARR_VERSION=//')
          IMAGE_SUFFIX=$(grep '^ARG IMAGE_SUFFIX=' Dockerfile | head -1 | sed 's/^ARG IMAGE_SUFFIX=//;s/"//g')
          
          # Get latest tag
          git fetch --tags 2>/dev/null || true
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          # Check if current onleiharr version is a pre-release
          if echo "$ONLEIHARR_VERSION" | grep -qE '[brcad]\d+'; then
            echo "Onleiharr version $ONLEIHARR_VERSION is a pre-release. Skipping version tag."
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "onleiharr_tag=$ONLEIHARR_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          if [ -n "$LATEST_TAG" ]; then
            # Parse: v{onleiharr}[-{suffix}]-{revision}
            if echo "$LATEST_TAG" | grep -qE '^v[0-9]+[.][0-9]+[.][0-9]+[-]'; then
              # Has suffix: v{onleiharr}-{suffix}-{revision}
              PREV_ONLEIHARR=$(echo "$LATEST_TAG" | sed 's/^v//;s/-.*//')
              PREV_SUFFIX=$(echo "$LATEST_TAG" | sed 's/^v[0-9]*[.][0-9]*[.][0-9]*-//;s/-[0-9]*$//')
              PREV_REV=$(echo "$LATEST_TAG" | sed 's/.*-//')
            else
              # No suffix: v{onleiharr}-{revision}
              PREV_ONLEIHARR=$(echo "$LATEST_TAG" | sed 's/^v//;s/-.*//')
              PREV_SUFFIX=""
              PREV_REV=$(echo "$LATEST_TAG" | sed 's/.*-//')
            fi
          else
            PREV_ONLEIHARR=""
            PREV_SUFFIX=""
            PREV_REV=0
          fi
          
          echo "Latest tag: $LATEST_TAG (onleiharr=$PREV_ONLEIHARR suffix='$PREV_SUFFIX' rev=$PREV_REV)"
          echo "Current: onleiharr=$ONLEIHARR_VERSION suffix='$IMAGE_SUFFIX'"
          
          # Compute new version
          if [ "$ONLEIHARR_VERSION" != "$PREV_ONLEIHARR" ] || [ "$IMAGE_SUFFIX" != "$PREV_SUFFIX" ]; then
            NEW_REV=1
          else
            NEW_REV=$((PREV_REV + 1))
          fi
          
          if [ -n "$IMAGE_SUFFIX" ]; then
            VERSION="${ONLEIHARR_VERSION}-${IMAGE_SUFFIX}-${NEW_REV}"
          else
            VERSION="${ONLEIHARR_VERSION}-${NEW_REV}"
          fi
          
          ONLEIHARR_TAG="$ONLEIHARR_VERSION"
          
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "onleiharr_tag=$ONLEIHARR_TAG" >> "$GITHUB_OUTPUT"
          echo "git_tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          
          echo "Computed version: $VERSION"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=raw,value=${{ steps.version.outputs.onleiharr_tag }},enable=${{ steps.version.outputs.version != '' }}
            type=sha
            type=raw,value=latest

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create git tag
        if: steps.version.outputs.version != ''
        run: |
          git tag ${{ steps.version.outputs.git_tag }}
          git push origin ${{ steps.version.outputs.git_tag }}

  build-and-push-dev:
    runs-on: ubuntu-latest
    needs: smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract metadata (dev tags only)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=oidc-dev-

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dev Docker image (OIDC fork)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            ONLEIHARR_SOURCE=git+https://github.com/m1n3rva/Onleiharr.git@oidc_autologin
          tags: ${{ steps.meta.outputs.tags }}
